spring.application.name=control_deudas

# ---------------------------------------------------------------------
# Datasource (H2 en memoria, solo para pruebas)
# Este archivo de test reemplaza por completo el application.properties
# de main, por lo que la base MySQL no se toca al ejecutar los tests.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# Seguridad JWT
# ---------------------------------------------------------------------
app.security.jwt.secret=control-deudas-test-secret-key-32-bytes-min!!
app.security.jwt.issuer=control-deudas-api
app.security.jwt.expiration=PT24H

# ---------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:4200

# ---------------------------------------------------------------------
# SpringDoc
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.edinsonamaya.control_deudas
