spring.application.name=control_deudas

# ---------------------------------------------------------------------
# Datasource (MySQL)
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/control_deudas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# Seguridad JWT
# La secreta debe tener al menos 32 bytes para HS256.
# En produccion se debe sobreescribir con la variable de entorno JWT_SECRET.
# ---------------------------------------------------------------------
app.security.jwt.secret=${JWT_SECRET:control-deudas-dev-secret-key-32-bytes-min!!}
app.security.jwt.issuer=control-deudas-api
app.security.jwt.expiration=PT24H

# ---------------------------------------------------------------------
# CORS (futuro frontend Angular)
# ---------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------------------------------------------------------------------
# SpringDoc OpenAPI / Swagger UI
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorting=alpha
springdoc.packages-to-scan=com.edinsonamaya.control_deudas
